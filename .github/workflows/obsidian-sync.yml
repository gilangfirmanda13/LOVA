name: Obsidian Vault Sync

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch LOVA data and write vault files
        env:
          SUPABASE_SYNC_URL: ${{ secrets.SUPABASE_SYNC_URL }}
          SUPABASE_SYNC_SECRET: ${{ secrets.SUPABASE_SYNC_SECRET }}
        run: node scripts/apply-obsidian-sync.js

      - name: Commit and push if anything changed
        run: |
          git config user.name "LOVA Sync Bot"
          git config user.email "actions@github.com"
          git add obsidian-vault
          if git diff --staged --quiet; then
            echo "No changes to sync."
          else
            git commit -m "Sync LOVA data to Obsidian vault [skip ci]"
            git push
          fi
