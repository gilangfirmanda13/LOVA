<title>LOVA Invite Links</title>
<style>
:root{
  --bg:#F7F5F0; --surface:#FFFFFF; --border:#E6E1D6; --ink:#232017; --stone:#726C5E;
  --teal:#0C7C6B; --teal-tint:#E4F3EF; --orange:#D97A3D; --orange-tint:#FBEADD;
  --purple:#6E5AA6; --purple-tint:#EFEBF7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1912; --surface:#242118; --border:#39352A; --ink:#F2EFE6; --stone:#B0A996;
    --teal:#3FD9BC; --teal-tint:#123B34; --orange:#F0A468; --orange-tint:#3D2A17;
    --purple:#B6A6E8; --purple-tint:#2B2440;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1912; --surface:#242118; --border:#39352A; --ink:#F2EFE6; --stone:#B0A996;
  --teal:#3FD9BC; --teal-tint:#123B34; --orange:#F0A468; --orange-tint:#3D2A17;
  --purple:#B6A6E8; --purple-tint:#2B2440;
}
*{box-sizing:border-box;}
body{background:var(--bg); color:var(--ink); font-family:'Inter',system-ui,sans-serif; margin:0; padding:32px 20px 60px;}
@font-face{font-family:'Fraunces';src:local('Fraunces');}
.wrap{max-width:640px; margin:0 auto;}
h1{font-family:'Fraunces',Georgia,serif; font-weight:600; font-size:28px; margin:0 0 6px; text-wrap:balance;}
.sub{color:var(--stone); font-size:14px; margin:0 0 28px;}
.card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 16px; margin-bottom:10px; display:flex; flex-direction:column; align-items:stretch; gap:0;}
.top-row{display:flex; align-items:center; gap:14px;}
.avatar{width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex-shrink:0; color:var(--teal);}
.info{flex:1; min-width:0;}
.name-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:2px;}
.email{font-weight:600; font-size:14.5px;}
.badge{font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; padding:3px 8px; border-radius:99px; white-space:nowrap;}
.badge.staff{background:var(--teal-tint); color:var(--teal);}
.badge.manager{background:var(--purple-tint); color:var(--purple);}
.badge.finance_admin{background:var(--orange-tint); color:var(--orange);}
.div-label{font-size:12px; color:var(--stone);}
.link-row{display:flex; align-items:center; gap:8px; margin-top:10px;}
.link-text{font-family:ui-monospace,'SF Mono',Consolas,monospace; font-size:11px; color:var(--stone); background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:6px 10px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.copy-btn{flex-shrink:0; border:none; background:var(--teal); color:#fff; font-size:12px; font-weight:600; padding:7px 14px; border-radius:8px; cursor:pointer;}
.copy-btn:active{transform:scale(0.97);}
.copy-btn.copied{background:var(--stone);}
.footer-note{margin-top:28px; font-size:12.5px; color:var(--stone); line-height:1.6;}
</style>
<div class="wrap">
  <h1>13 Invite Link Siap Dibagikan</h1>
  <p class="sub">Link undangan tim LOVA — klik "Salin" lalu kirim manual lewat WhatsApp/email (pengiriman email otomatis belum aktif untuk domain lenusa.id).</p>
  <div id="list"></div>
  <div class="footer-note">Setiap link berlaku 14 hari sejak dibuat. Kalau kadaluarsa, buat ulang lewat menu Team di LOVA.</div>
</div>
<script>
const BASE = "https://lova-lenusa.netlify.app/auth.html?invite=";
const ROLE_LABEL = { staff:"Staff", manager:"Manager", finance_admin:"Finance Admin" };
const DIV_LABEL = { pbd:"Project & Business Development", lnd:"Learning & Development", creative:"Creative Team" };
const people = [
  {email:"arya@lenusa.id", role:"staff", div:"creative", token:"ff68f41a-8714-476f-aace-0bcf120e0f81"},
  {email:"rizal@lenusa.id", role:"staff", div:"creative", token:"74206c82-1055-4d1a-8731-0c32f7278311"},
  {email:"riwando@lenusa.id", role:"staff", div:"lnd", token:"9f78f38b-547c-4f39-8101-58e88ba978d5"},
  {email:"regina@lenusa.id", role:"staff", div:"lnd", token:"c2c13c9f-7ad2-4442-ade1-1a2239cc01f2"},
  {email:"sindy@lenusa.id", role:"finance_admin", div:"lnd", token:"d85a7116-d7b7-4f26-9cba-f1e344039108"},
  {email:"hilda@lenusa.id", role:"staff", div:"lnd", token:"87f01d2a-af83-4e77-8546-2f4f1cb97704"},
  {email:"ayu@lenusa.id", role:"staff", div:"lnd", token:"deccd8e7-7cdb-49b6-9e43-85a591f43b52"},
  {email:"dinda@lenusa.id", role:"staff", div:"lnd", token:"a75845b4-3b49-4b57-b8d3-5631697fe7d5"},
  {email:"yola@lenusa.id", role:"manager", div:"pbd", token:"a3f8c3e2-9a82-49f7-8a56-6d6a3a304476"},
  {email:"anjeli@lenusa.id", role:"staff", div:"pbd", token:"0ee13530-32bf-494b-83c4-1f41fad31247"},
  {email:"bilqis@lenusa.id", role:"staff", div:"pbd", token:"f53a0861-e089-40fc-8567-e706d63318fa"},
  {email:"kalista@lenusa.id", role:"finance_admin", div:"pbd", token:"21839fbf-26c6-4106-a65a-fd40a28ce2ae"},
  {email:"ana@lenusa.id", role:"manager", div:"pbd", token:"c37ad0f3-5797-4f80-be25-718663547fab"},
];
const avatarBg = { staff:"var(--teal-tint)", manager:"var(--purple-tint)", finance_admin:"var(--orange-tint)" };
const list = document.getElementById('list');
people.forEach(function(p){
  const link = BASE + p.token;
  const initial = p.email.charAt(0).toUpperCase();
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML =
    '<div class="top-row">' +
      '<div class="avatar" style="background:' + avatarBg[p.role] + '">' + initial + '</div>' +
      '<div class="info">' +
        '<div class="name-row"><span class="email">' + p.email + '</span><span class="badge ' + p.role + '">' + ROLE_LABEL[p.role] + '</span></div>' +
        '<div class="div-label">' + DIV_LABEL[p.div] + '</div>' +
      '</div>' +
    '</div>' +
    '<div class="link-row">' +
      '<div class="link-text">' + link + '</div>' +
      '<button class="copy-btn" data-link="' + link + '">Salin</button>' +
    '</div>';
  list.appendChild(card);
});
list.addEventListener('click', function(e){
  const btn = e.target.closest('.copy-btn');
  if(!btn) return;
  navigator.clipboard.writeText(btn.dataset.link).then(function(){
    const orig = btn.textContent;
    btn.textContent = 'Tersalin ✓';
    btn.classList.add('copied');
    setTimeout(function(){ btn.textContent = orig; btn.classList.remove('copied'); }, 1500);
  }).catch(function(){});
});
</script>
